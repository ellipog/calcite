# Nightly builds of the Calcite server (CAL-230). Each night, and when run by hand, the newest
# commit on main whose rig run passed is built in release for Windows and Linux on x86-64 and
# published as the prerelease `nightly`, made again on that commit each time. The assets keep
# their names, so their addresses always give the newest build; the site's download page links
# them and reads `nightly.json` beside them. A night when that commit is already the nightly
# builds nothing, unless the run is by hand with `force`. Calx is built from its main branch, as
# rig.yml builds it, pinned for the run so both builds use the same commit; the notes name both
# commits. No Mojang code goes in an archive: the server reads vanilla's data from the game, or
# downloads it from Mojang, the first time it starts.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Publish even if the newest green commit is already the nightly
        type: boolean
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  pick:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.pick.outputs.build }}
      sha: ${{ steps.pick.outputs.sha }}
      committed: ${{ steps.pick.outputs.committed }}
      calx: ${{ steps.pick.outputs.calx }}
    steps:
      - name: Pick the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          sha=$(gh run list -R "$GITHUB_REPOSITORY" --workflow rig.yml --branch main --event push --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ -z "$sha" ]; then
            echo "::notice::No commit on main has a passing rig run, so there's nothing to build."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release's tag is made on the commit built, which GitHub refused this workflow's
          # token for 865b8b4, whose workflows weren't main's, as it guards workflow files, so a
          # commit from before main's workflows last changed waits for a newer one to pass.
          workflows() { gh api "repos/$GITHUB_REPOSITORY/contents/.github?ref=$1" --jq '.[] | select(.name == "workflows") | .sha'; }
          if [ "$(workflows "$sha")" != "$(workflows "$GITHUB_SHA")" ]; then
            echo "::notice::${sha:0:7}, the newest commit with a passing rig run, has other workflows than main, so it waits for a newer one to pass."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/nightly" --jq .object.sha 2>/dev/null || true)
          if [ "$sha" = "$current" ] && [ "$FORCE" != "true" ]; then
            echo "::notice::The nightly is already ${sha:0:7}, the newest commit with a passing rig run."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          committed=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha" --jq .commit.committer.date)
          calx=$(gh api repos/ellipog/calx/commits/main --jq .sha)
          echo "Building ${sha:0:7}, committed $committed, with Calx ${calx:0:7}."
          {
            echo "build=true"
            echo "sha=$sha"
            echo "committed=$committed"
            echo "calx=$calx"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: pick
    if: needs.pick.outputs.build == 'true'
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            platform: windows
            asset: calcite-windows-x64.zip
          - os: ubuntu-latest
            platform: linux
            asset: calcite-linux-x64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      CXX: clang++
      CALX_CACHE: ${{ github.workspace }}/calx-cache
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
          path: calcite
      # Calx's objects from rig.yml's latest run on this system, where there are some, so only the
      # modules that changed since are compiled again.
      - uses: actions/cache/restore@v4
        with:
          path: calx-cache/obj
          key: calx-objects-${{ matrix.platform }}-nightly
          restore-keys: calx-objects-${{ matrix.platform }}-
      # The archive's readme, from the commit this workflow runs from, which may be newer than the
      # one built.
      - uses: actions/checkout@v4
        with:
          path: workflow
          sparse-checkout: .github/nightly
      - uses: actions/checkout@v4
        with:
          repository: ellipog/calx
          ref: ${{ needs.pick.outputs.calx }}
          path: calx
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Install clang, lld and Ninja
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang lld ninja-build
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: python -m pip install ninja
      # Puts the MSVC libraries the linker needs on the environment.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      # The compiler rig.yml built and kept for the same calx commit, where there's one.
      - uses: actions/cache@v4
        id: calx-build
        with:
          path: calx/build/compiler/${{ matrix.platform }}
          key: calx-build-${{ matrix.platform }}-${{ needs.pick.outputs.calx }}
      - name: Build calx
        if: steps.calx-build.outputs.cache-hit != 'true'
        run: |
          cmake -S calx/compiler -B calx/build/compiler/${{ matrix.platform }} -G Ninja -DCMAKE_CXX_COMPILER=clang++
          ninja -C calx/build/compiler/${{ matrix.platform }}
      # The platform comes from the matrix, not the environment: msvc-dev-cmd sets `Platform`,
      # which on Windows, where names ignore case, would be the same variable.
      - name: Build Calcite
        shell: bash
        working-directory: calcite
        run: |
          set -euo pipefail
          exe=""
          if [ "$RUNNER_OS" = "Windows" ]; then exe=".exe"; fi
          mkdir -p "$GITHUB_WORKSPACE/out/calcite"
          "$GITHUB_WORKSPACE/calx/build/compiler/${{ matrix.platform }}/calx$exe" build --release src/calcite.calx -o "$GITHUB_WORKSPACE/out/calcite/calcite$exe"
      - name: Pack it
        shell: bash
        env:
          ASSET: ${{ matrix.asset }}
          SHA: ${{ needs.pick.outputs.sha }}
          CALX: ${{ needs.pick.outputs.calx }}
          COMMITTED: ${{ needs.pick.outputs.committed }}
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/out"
          cp calcite/LICENSE calcite/NOTICE "$out/calcite/"
          sed -e "s/DATE/${COMMITTED%%T*}/" -e "s/COMMIT/$SHA/" -e "s/CALX/$CALX/" workflow/.github/nightly/README.txt > "$out/calcite/README.txt"
          mkdir -p dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            (cd "$out" && 7z a -tzip "$GITHUB_WORKSPACE/dist/$ASSET" calcite > /dev/null)
          else
            # The newest glibc the server's symbols ask for, which the download page names.
            objdump -T "$out/calcite/calcite" | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -uV | tail -1 > dist/glibc.txt
            tar -czf "dist/$ASSET" -C "$out" calcite
          fi
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: nightly-${{ matrix.platform }}
          path: dist/
          retention-days: 3

  publish:
    needs: [pick, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: nightly-*
          merge-multiple: true
      - name: Publish the nightly
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.pick.outputs.sha }}
          CALX: ${{ needs.pick.outputs.calx }}
          COMMITTED: ${{ needs.pick.outputs.committed }}
        run: |
          set -euo pipefail
          built=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          glibc=$(cat glibc.txt)
          rm glibc.txt
          files="calcite-windows-x64.zip calcite-linux-x64.tar.gz"
          sha256sum $files > SHA256SUMS
          assets='[]'
          for f in $files; do
            assets=$(jq --arg name "$f" --argjson size "$(stat -c %s "$f")" --arg sha256 "$(sha256sum "$f" | cut -d' ' -f1)" '. + [{name: $name, size: $size, sha256: $sha256}]' <<< "$assets")
          done
          jq -n --arg commit "$SHA" --arg committed "$COMMITTED" --arg calx "$CALX" --arg built "$built" --arg glibc "$glibc" --argjson assets "$assets" \
            '{commit: $commit, committed: $committed, calx: $calx, built: $built, glibc: $glibc, assets: $assets}' > nightly.json
          cat nightly.json
          short=${SHA:0:7}
          title="Calcite nightly ${COMMITTED%%T*} ($short)"
          cat > notes.md <<EOF
          A development build of Calcite from [\`$short\`](https://github.com/$GITHUB_REPOSITORY/commit/$SHA), committed ${COMMITTED%%T*}: the newest commit on main whose tests passed, built with Calx at [\`${CALX:0:7}\`](https://github.com/ellipog/calx/commit/$CALX). It's tested no further than that, so back up a world before you open it with this build.

          - **Windows** (x86-64): \`calcite-windows-x64.zip\`
          - **Linux** (x86-64, glibc $glibc or later): \`calcite-linux-x64.tar.gz\`

          Unpack it and start \`calcite\` in the folder you want the server's files in. [Getting started](https://calcitemc.com/docs/start) says what it does the first time and how to let players in. \`SHA256SUMS\` has the archives' checksums.

          Calcite is source-available under the Business Source License 1.1, in \`LICENSE\` in each archive. You may run it for free on your own servers, commercial ones included; offering it to others as a hosting service needs a [host license](https://github.com/$GITHUB_REPOSITORY/blob/main/docs/hosting.md), which is free for now. Calcite contains no Mojang code or assets: the first time it starts, it reads vanilla's data from Minecraft's client jar, from the game or from Mojang.
          EOF
          # The last nightly and its tag go, then the release is made again on the commit built,
          # which makes its tag, so its assets' addresses stay the same. Making it new, rather
          # than moving the tag, doesn't ask GitHub to change a tag from one commit's workflows to
          # another's.
          gh release delete nightly -R "$GITHUB_REPOSITORY" --cleanup-tag --yes > /dev/null 2>&1 || true
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/nightly" > /dev/null 2>&1 || true
          gh release create nightly -R "$GITHUB_REPOSITORY" --target "$SHA" --prerelease --title "$title" --notes-file notes.md $files SHA256SUMS nightly.json
          echo "::notice::Published $title"

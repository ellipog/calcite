# The rig's own tests, and Calcite scored against the committed hashes (P1.9).
# Only hashes are committed, so CI never needs the vanilla jar.
name: rig

on:
  push:
  pull_request:

jobs:
  runner:
    name: runner (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # The oldest Python the runner supports, and the newest.
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Runner tests
        run: python -I -W error::ResourceWarning -m unittest discover -s rig/runner/tests -v
      - name: Cases and hashes
        run: python -I rig/runner/rig.py list
      - name: Score Calcite
        run: python -I rig/runner/rig.py score

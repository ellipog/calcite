# The rig's own tests, the data converter's tests, and Calcite scored against the committed
# hashes (P1.9). Only hashes and pins are committed. Scoring Calcite needs the pinned server jar,
# which Calcite reads its data pack from, and so do the case generators the rig's tests rerun, so
# the Calcite job downloads it from Mojang as the server does on its first start, and caches it.
# Calcite's tests end by reading every packet their clients were sent with the jar's own codecs
# (D145), so the vanilla adapter is built first, with JDK 25.
# Calcite is built with calx from its main branch, checked out beside it as the workspace has it.
# The nightly build (nightly.yml) takes the newest commit on main whose run here passed.
name: rig

on:
  push:
  pull_request:

jobs:
  runner:
    name: runner (${{ matrix.os }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # The oldest Python the runner supports, and the newest.
        python: ["3.10", "3.x"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The tools that are Python still: the session runner and the comparisons it imports. The
      # runner, the deflater, the case generators and the protocol suites' comparison are Calx,
      # tested in the score part; sessiondiff.py goes once the session runner is Calx (CAL-253).
      - name: Python tool tests
        run: python -I -W error::ResourceWarning -m unittest discover -s rig/runner/tests -v

  # Each system's work in five jobs side by side (CAL-230): the tests in four parts, which
  # src/test/run.calx deals out by weight and runs four builds at a time on the runner's four cores,
  # and the score and the lockstep check. The compiler is built once for each calx commit and
  # kept in the cache.
  calcite:
    name: Calcite (${{ matrix.os }}, ${{ matrix.part == 'score' && 'score and lockstep' || format('tests {0} of 4', matrix.part) }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        part: ["1", "2", "3", "4", score]
        # Not an environment variable: msvc-dev-cmd sets Platform, and Windows ignores case.
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    # A part takes 25 minutes at most; one that hangs fails here, not after GitHub's six hours.
    timeout-minutes: 60
    env:
      CXX: clang++
      # Calx's objects, one for each module's C, named by its content and kept from the last run
      # of the same part, so a run compiles again only the modules that changed. A part makes
      # thousands, far past the 1024 the cache keeps by default, so it keeps 4 GB of them however
      # many that is; and its release builds leave out ThinLTO, so a build that finds all its
      # objects there only links, where ThinLTO compiled each program's machine code again in its
      # link (CLX-210, CLX-211). The nightly's builds keep ThinLTO.
      CALX_CACHE: ${{ github.workspace }}/calx-cache
      CALX_CACHE_MB: "4096"
      CALX_LTO: "0"
      # A debug build keeps where each block was allocated, so a leak report names its code. One
      # play test in debug once ended with two blocks never freed, and hasn't since (CLX-194). It
      # costs the play test nothing visible; release builds don't read it.
      CALX_LEAKS: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          path: calcite
      - uses: actions/checkout@v4
        with:
          repository: ellipog/calx
          path: calx
      - uses: actions/cache@v4
        with:
          path: calx-cache/obj
          key: calx-objects-${{ matrix.platform }}-${{ matrix.part }}-${{ github.sha }}
          restore-keys: calx-objects-${{ matrix.platform }}-${{ matrix.part }}-
      - name: Calx's commit
        id: calx
        shell: bash
        run: echo "sha=$(git -C calx rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      # The runner's image has LLVM, clang and lld among it, in /usr/lib/llvm-<version>/bin; apt
      # only added the packages that name them `clang` and `ld.lld`. So the newest of those folders
      # with all three goes on the path, and Ninja comes from PyPI, as on Windows: apt's mirrors
      # failed to resolve for three tries on 2026-11-11, and one hung for half an hour on
      # 2026-11-10. Only an image without them falls back to apt, each try cut off at five
      # minutes, three tries.
      - name: Install clang, lld and Ninja
        if: runner.os == 'Linux'
        timeout-minutes: 20
        run: |
          python -m pip install ninja
          llvm=""
          for d in $(ls -d /usr/lib/llvm-*/bin 2>/dev/null | sort -V); do
            if [ -x "$d/clang" ] && [ -x "$d/clang++" ] && [ -x "$d/ld.lld" ]; then
              llvm="$d"
            fi
          done
          if [ -n "$llvm" ]; then
            echo "$llvm" >> "$GITHUB_PATH"
            "$llvm/clang" --version
            exit 0
          fi
          for try in 1 2 3; do
            if sudo timeout 300 apt-get update && sudo timeout 300 apt-get install -y clang lld; then
              exit 0
            fi
            echo "apt-get failed or hung on try $try"
            sleep 15
          done
          exit 1
      - name: Install Ninja
        if: runner.os == 'Windows'
        run: python -m pip install ninja
      # Puts the MSVC libraries the linker needs on the environment.
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/cache@v4
        id: calx-build
        with:
          path: calx/build/compiler/${{ matrix.platform }}
          key: calx-build-${{ matrix.platform }}-${{ steps.calx.outputs.sha }}
      - name: Build calx
        if: steps.calx-build.outputs.cache-hit != 'true'
        run: |
          cmake -S calx/compiler -B calx/build/compiler/${{ matrix.platform }} -G Ninja -DCMAKE_CXX_COMPILER=clang++
          ninja -C calx/build/compiler/${{ matrix.platform }}
      # Calcite's tools are Calx programs (CAL-253), run with the calx just built.
      - name: Put calx on the path
        shell: bash
        run: echo "${{ github.workspace }}/calx/build/compiler/${{ matrix.platform }}" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: calcite/oracle/jars
          key: server-jar-${{ hashFiles('calcite/oracle/versions.json') }}
      - name: Fetch the server jar
        working-directory: calcite
        run: calx oracle/fetch.calx
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Build the vanilla adapter
        working-directory: calcite
        run: calx oracle/adapter.calx
      - name: Calcite's tests
        if: matrix.part != 'score'
        working-directory: calcite
        run: calx src/test/run.calx --jobs 4 --shard ${{ matrix.part }}/4
      # The converter's checks and the fetch step's, offline, on made-up reports and jars (CAL-253).
      - name: Converter and fetch tests
        if: matrix.part == 'score'
        working-directory: calcite
        run: calx test oracle/datagen/tests/test_convert.calx
      # The modules calx_tables writes from made-up tables, and the tables it refuses (CAL-253).
      - name: Table writer tests
        if: matrix.part == 'score'
        working-directory: calcite
        run: calx test oracle/datagen/tests/test_calx_tables.calx
      # The runner's frames, hashes, blobs, case files and store, and the ping adapter scored
      # end to end (CAL-253).
      - name: Runner tests
        if: matrix.part == 'score'
        working-directory: calcite
        run: calx test rig/runner/tests/test_runner.calx
      # The deflate, zlib and gzip streams the case generators compress with (CAL-253).
      - name: Deflater tests
        if: matrix.part == 'score'
        working-directory: calcite
        run: calx test rig/runner/tests/test_deflate.calx
      # The protocol suites' comparison, on sessions written by hand (CAL-253).
      - name: Session comparison tests
        if: matrix.part == 'score'
        working-directory: calcite
        run: calx test rig/runner/tests/test_sessiondiff.calx
      # Each case generator written in Calx writes its committed file again exactly (D249).
      - name: Case generator tests
        if: matrix.part == 'score'
        working-directory: calcite
        run: calx test rig/runner/tests/test_generators.calx
      - name: Cases and hashes
        if: matrix.part == 'score'
        working-directory: calcite
        run: calx rig/runner/rig.calx list
      # Fails if any case fails or errors. Probes Calcite doesn't have yet are unimplemented.
      - name: Score Calcite
        if: matrix.part == 'score'
        working-directory: calcite
        run: calx rig/runner/rig.calx score --strict
      # G5.3 (D283): a session the server records with 8 chunk workers, bots walking into new
      # terrain, replays on one thread to the same packets and lines.
      - name: Lockstep check
        if: matrix.part == 'score'
        working-directory: calcite
        run: calx rig/lockstep.calx

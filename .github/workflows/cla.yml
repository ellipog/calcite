# The Contributor License Agreement check (docs/CLA.md, D546). An author agrees by commenting the
# sentence in PHRASE on a pull request. Each run reads the pull request's comments, records new
# agreements in signatures.json on the cla-signatures branch (made by the first run that needs it),
# then sets the pull request's `cla` status and keeps one comment saying who still has to agree.
# Reading the comments again on every run makes recording idempotent, so a run that is skipped or
# cancelled is made up by the next one.
#
# It never checks out or runs the pull request's code, which is what keeps pull_request_target's
# write token safe on pull requests from forks. Writes made with that token don't start workflows,
# so the signature commits don't run the rig.
name: cla

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: cla-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  cla:
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, 'Contributor License Agreement'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const PHRASE = 'I have read the Calcite Contributor License Agreement and I agree to it.';
            const AGREEMENT = 'Calcite CLA 1 (Harmony HA-CLA-I-ANY 1.0)';
            const BRANCH = 'cla-signatures';
            const FILE = 'signatures.json';
            const MARK = '<!-- cla -->';
            const ALLOW = new Set(['ellipog']);
            const { owner, repo } = context.repo;
            const DOC = `https://github.com/${owner}/${repo}/blob/main/docs/CLA.md`;
            const number = (context.payload.pull_request || context.payload.issue).number;
            const norm = (s) => (s || '').replace(/\s+/g, ' ').trim().replace(/\.$/, '').toLowerCase();

            // The signature list, and the sha to update it with; the branch is made on first use.
            async function load() {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: FILE, ref: BRANCH });
                return { sha: data.sha, list: JSON.parse(Buffer.from(data.content, 'base64').toString('utf8')) };
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              try {
                await github.rest.git.getRef({ owner, repo, ref: `heads/${BRANCH}` });
                return { sha: null, list: [] };
              } catch (e) {
                if (e.status !== 404) throw e;
              }
              const readme = 'Who has agreed to Calcite\'s Contributor License Agreement (docs/CLA.md on main), as '
                + '.github/workflows/cla.yml records it: each GitHub account, the comment it agreed with, and when.\n';
              const tree = await github.rest.git.createTree({ owner, repo, tree: [
                { path: 'README.md', mode: '100644', type: 'blob', content: readme },
                { path: FILE, mode: '100644', type: 'blob', content: '[]\n' },
              ] });
              const commit = await github.rest.git.createCommit({
                owner, repo, message: 'cla: start the signature list', tree: tree.data.sha, parents: [],
              });
              try {
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${BRANCH}`, sha: commit.data.sha });
              } catch (e) {
                if (e.status !== 422) throw e; // another run made it first
              }
              return load();
            }

            // Adds the new signatures, reading the list again if another run wrote it meanwhile.
            async function record(found) {
              for (let attempt = 0; attempt < 5; attempt++) {
                const { sha, list } = await load();
                const have = new Set(list.map((s) => s.id));
                const fresh = found.filter((s) => !have.has(s.id));
                if (!fresh.length) return list;
                const next = list.concat(fresh);
                try {
                  await github.rest.repos.createOrUpdateFileContents({
                    owner, repo, path: FILE, branch: BRANCH, ...(sha ? { sha } : {}),
                    message: `cla: ${fresh.map((s) => s.login).join(', ')} agreed in #${number}`,
                    content: Buffer.from(JSON.stringify(next, null, 2) + '\n').toString('base64'),
                  });
                  return next;
                } catch (e) {
                  if (e.status !== 409 && e.status !== 422) throw e;
                }
              }
              throw new Error('the signature list kept changing; run the check again');
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: number, per_page: 100,
            });
            const found = [];
            for (const c of comments) {
              if (c.user && c.user.type !== 'Bot' && norm(c.body) === norm(PHRASE) && !found.some((s) => s.id === c.user.id)) {
                found.push({ login: c.user.login, id: c.user.id, comment: c.html_url, at: c.created_at, agreement: AGREEMENT });
              }
            }
            const list = found.length ? await record(found) : (await load()).list;

            // Whoever opened the pull request and every commit's author has to have agreed.
            const pr = context.payload.pull_request
              || (await github.rest.pulls.get({ owner, repo, pull_number: number })).data;
            const commits = await github.paginate(github.rest.pulls.listCommits, {
              owner, repo, pull_number: number, per_page: 100,
            });
            const need = new Map();
            const unlinked = new Set();
            const want = (u) => { if (u.type !== 'Bot' && !ALLOW.has(u.login)) need.set(u.id, u.login); };
            want(pr.user);
            for (const c of commits) {
              if (c.author) want(c.author);
              else unlinked.add((c.commit.author && c.commit.author.name) || c.sha.slice(0, 7));
            }
            const signed = new Set(list.map((s) => s.id));
            const missing = [...need].filter(([id]) => !signed.has(id)).map(([, login]) => login);
            const ok = !missing.length && !unlinked.size;

            await github.rest.repos.createCommitStatus({
              owner, repo, sha: pr.head.sha, context: 'cla', target_url: DOC,
              state: ok ? 'success' : 'failure',
              description: ok ? 'Every author has agreed to the CLA' : 'Waiting for authors to agree to the CLA',
            });

            const lines = [MARK];
            if (ok) {
              lines.push(`Every author of this pull request has agreed to the [Contributor License Agreement](${DOC}). Thank you.`);
            } else {
              lines.push(
                `Thank you for the pull request. Before it can be merged, each of its authors agrees to Calcite's [Contributor License Agreement](${DOC}), once. To agree, comment on this pull request with exactly this sentence:`,
                '', '```text', PHRASE, '```', '');
              if (missing.length) lines.push(`Still to agree: ${missing.map((l) => '@' + l).join(', ')}.`, '');
              if (unlinked.size) {
                lines.push(`Some commits are by ${[...unlinked].join(', ')}, with an email that isn't on a GitHub account, so who wrote them can't be checked. Add that email to your GitHub account, or make the commits again with one that is, and push.`, '');
              }
              lines.push(`If you're under 18, a parent or guardian agrees too, as [the agreement](${DOC}#how-to-agree) says.`);
            }
            const body = lines.join('\n');
            const mine = comments.find((c) => c.user && c.user.type === 'Bot' && (c.body || '').includes(MARK));
            if (mine) {
              if (mine.body !== body) await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else if (!ok) {
              await github.rest.issues.createComment({ owner, repo, issue_number: number, body });
            }
            core.info(ok ? 'every author has agreed' : `still to agree: ${[...missing, ...unlinked].join(', ')}`);
